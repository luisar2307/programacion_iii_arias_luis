<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luis Arias</title>
</head>
<body>
    <h1>Formulario de Registro de Pacientes</h1>
    <h2>Autor: Luis Arias</h2>
    <form action="/registro" method="post">
        <table>
            <tr> 
                <td>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" 
                    placeholder="Ej. Juan " 
                    minlength="3" 
                    maxlength="40" 
                    required>
                </td>
                <td>
                    <label for="apellido">Apellido:</label><br>
                    <input type="text" id="apellido" name="apellido" 
                    placeholder="Ej. Pérez" 
                    minlength="3" 
                    maxlength="40" 
                    required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password" >
                </td>
                <td>
                    <label for="password_confirm">Confirmar Contraseña:</label><br>
                    <input type="password" id="password_confirm" name="password_confirm" >
                </td>
            </tr>
            <tr>
                <td>
                    <label for="edad">Edad:</label><br>
                    <input type="number" id="edad" name="edad" >
                </td>
                <td>
                    <label for="dolor">Nivel de dolor:</label><br>
                    <input type="number" id="dolor" name="dolor" 
                    min="1"
                    max="10"
                    value="5"
                    step="1">
                </td>
            </tr>
            <tr>
                <td>
                    <p>Seleccione el tipo de consulta:</p>
                    <input type="radio" id="presencial" name="tipo" value="presencial" >
                    <label for="presencial">Presencial</label>
                    <input type="radio" id="virtual" name="tipo" value="virtual" >
                    <label for="virtual">Virtual</label>
                </td>
                <td>
                    <p>Seleccione sus síntomas:</p><br>
                    <input type="checkbox" 
                        id="fiebre" 
                        name="sintomas" 
                        value="fiebre" 
                        >
                    <label for="fiebre">Fiebre</label><br>
                    <input
                    type="checkbox"
                    id="tos"
                    name="sintomas"
                    value="tos">
                    <label for="tos">Tos</label><br>
                    <input
                    type="checkbox"
                    id="cefalea"
                    name="sintomas"
                    value="cefalea"
                    >
                    <label for="cefalea">Dolor de cabeza</label><br>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="especialidad">Especialidad:</label><br>
                    <select id="especialidad" name="especialidad" required>
                        <option value="">
                            Selecciona una Especialidad
                        </option>
                        <option value="general">Medicina General</option>
                        <option value="pediatria">Pediatría</option>
                        <option value="cardiologia">Cardiología</option>
                        <option value="dermatologia">Dermatología</option>
                    </select>
                </td>
                <td>
                    <label for="examenes">Exámenes:</label><br>
                    <select id="examenes" name="examenes" multiple size="2" >
                        <option value="" selected>
                            Selecciona un Examen
                        </option>
                        <option value="sangre">Examen de sangre</option>
                        <option value="orina">Examen de orina</option>
                        <option value="rayosx">Rayos X</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <fieldset>
                        <legend>Datos Generales</legend>
                        <label for="alergias">Alergias:</label><br>
                        <input type="text" id="alergias" name="alergias">
                        <br>
                        <label for="consultas">Consultas previas:</label><br>
                        <input type="number" id="consultas" name="consultas">
                    </fieldset>
                </td>
            </tr>
        </table>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
</body>
</html>
